<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Lab Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7fb; --card:#ffffff; --ink:#1b2333; --muted:#5a6476; --line:#d8dee9; --soft:#eef3f8;
  --accent:#1f7a8c; --accent-ink:#ffffff; --sun:#f2a541; --berry:#c2457a; --leaf:#3a9a5b;
  --ok:#1e8e4f; --warn:#a96300; --bad:#b3261e; --hl:#fff1c2; --focus:#f2a541;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131823; --card:#1c2231; --ink:#e7ecf4; --muted:#a4aec0; --line:#313a4e; --soft:#232b3d;
    --accent:#5cc2d4; --accent-ink:#0f1a22; --sun:#f2b05e; --berry:#e57aa6; --leaf:#6cc98b;
    --ok:#5bd08d; --warn:#f0b35a; --bad:#ff8a80; --hl:#4a3f12; --focus:#f2b05e;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.topbar{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--ink)}
.brand .flask{font-size:1.5rem}
.spacer{flex:1}
.savechip{font-size:.85rem;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:18px 16px 90px}
h1{font-size:1.6rem;margin:6px 0 4px;line-height:1.25}
h2{font-size:1.2rem;margin:0 0 8px}
h3{font-size:1.05rem;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;min-height:44px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer;text-decoration:none}
.btn.secondary{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.small{min-height:36px;padding:6px 12px;font-size:.92rem}
.btn.danger{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.say{border:0;background:var(--soft);border-radius:10px;min-width:40px;min-height:40px;cursor:pointer;font-size:1.05rem;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--ink);min-height:120px}
.mod:hover{border-color:var(--accent)}
.mod .num{font-size:.85rem;font-weight:700;color:var(--berry);letter-spacing:.04em;text-transform:uppercase}
.mod .t{font-weight:700;font-size:1.05rem;line-height:1.3}
.mod.now{border:2px solid var(--sun)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:auto}
.bar span{display:block;height:100%;background:var(--leaf)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.info{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.grey{background:var(--soft);color:var(--muted)}
.pill.tag{background:color-mix(in srgb,var(--berry) 14%,transparent);color:var(--berry)}
.labrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.labrow:first-of-type{border-top:0}
.labrow .lt{flex:1 1 260px}
.labrow .lt b{font-size:1.02rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:22px;height:22px;margin-top:3px;flex:none}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:960px){.cols{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.sect{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.sect .head{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.sect .head h3{margin:0;flex:1}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);resize:vertical;line-height:1.5}
input[type=text],input[type=date],input[type=password],input[type=number],select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);min-height:44px;max-width:100%}
.hints{margin:6px 0 0;padding:0;list-style:none}
.hints li{font-size:.9rem;color:var(--warn);padding:2px 0}
.hints li::before{content:"💡 "}
.speaking{background:var(--hl)!important;border-radius:8px}
.safety{border:2px solid var(--sun);background:color-mix(in srgb,var(--sun) 9%,var(--card))}
.safety ul{margin:6px 0;padding-left:20px}
.hz{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;transform:rotate(45deg);border:3px solid var(--bad);border-radius:4px;margin-right:10px;flex:none}
.hz span{transform:rotate(-45deg);font-size:.9rem}
table.dt{border-collapse:collapse;width:100%;font-size:.95rem}
table.dt th,table.dt td{border:1px solid var(--line);padding:4px}
table.dt input{width:100%;min-width:60px;min-height:36px;border:0;background:transparent;padding:4px 6px}
table.dt th input{font-weight:700}
.tablewrap{overflow-x:auto}
.unit{font-size:.82rem;min-height:32px!important;padding:2px 4px!important;width:100%}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.photo{border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--bg)}
.photo img{width:100%;height:110px;object-fit:cover;border-radius:8px;display:block}
.photo input{width:100%;min-height:34px;margin-top:4px;font-size:.85rem}
svg.graph{width:100%;height:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.gcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;background:var(--soft)}
.ycheck{display:inline-flex;align-items:center;gap:6px;min-height:36px}
.ycheck input{width:20px;height:20px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
.report .repgraph{max-width:560px;color:#111;margin:10px 0;break-inside:avoid}
.report .repgraph svg.graph{background:#fff}
.report .repgraph .cap{font-size:.9rem;color:#333;font-style:italic}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border-radius:18px;max-width:520px;width:100%;padding:18px 20px;max-height:90vh;overflow:auto}
.stopbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:700}
.report{background:#fff;color:#111;border-radius:12px;padding:28px 32px;font-family:Georgia,"Times New Roman",serif;line-height:1.55;max-width:820px;margin:0 auto;border:1px solid var(--line)}
.report h1{font-family:inherit;font-size:1.5rem;margin:0 0 4px}
.report h2{font-family:inherit;font-size:1.1rem;margin:18px 0 4px;border-bottom:1px solid #ccc;padding-bottom:2px}
.report .meta{color:#444;font-size:.95rem}
.report table{border-collapse:collapse;margin:8px 0}
.report th,.report td{border:1px solid #999;padding:4px 8px;text-align:left}
.report img{max-width:48%;margin:4px 1% 4px 0;border:1px solid #ccc}
.report figure{display:inline-block;width:48%;margin:4px 1% 4px 0;vertical-align:top}
.report figure img{max-width:100%;width:100%}
.report figcaption{font-size:.85rem;color:#444}
.report .p{white-space:pre-wrap}
.report .comment{border-left:4px solid #1f7a8c;background:#f1f7f9;padding:8px 12px;margin-top:16px}
.report.para p.speaking{background:#fff1c2}
.pf-break{page-break-before:always;break-before:page}
footer.ver{max-width:1180px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.85rem}
@media print{
  body{background:#fff}
  .topbar,.noprint,footer.ver,.stopbar,.toast{display:none!important}
  main{padding:0;max-width:none}
  .report{border:0;padding:0;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function fmtDate(iso){ if(!iso) return ""; var p=iso.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); return d.toLocaleDateString("en-CA",{year:"numeric",month:"long",day:"numeric"}); }

/* ===================== Storage (IndexedDB) ===================== */
var DBN="fun-lab-reports", db=null, data=null;
function openDB(){
  return new Promise(function(res,rej){
    var r=indexedDB.open(DBN,1);
    r.onupgradeneeded=function(){ var d=r.result; if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); if(!d.objectStoreNames.contains("photos")) d.createObjectStore("photos"); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); };
  });
}
function idbGet(store,key){ return new Promise(function(res,rej){ var t=db.transaction(store,"readonly"), q=t.objectStore(store).get(key); q.onsuccess=function(){res(q.result);}; q.onerror=function(){rej(q.error);}; }); }
function idbPut(store,key,val){ return new Promise(function(res,rej){ var t=db.transaction(store,"readwrite"); t.objectStore(store).put(val,key); t.oncomplete=function(){res();}; t.onerror=function(){rej(t.error);}; t.onabort=function(){rej(t.error);}; }); }
function idbDel(store,key){ return new Promise(function(res){ var t=db.transaction(store,"readwrite"); t.objectStore(store).delete(key); t.oncomplete=function(){res();}; t.onerror=function(){res();}; }); }
function idbAllKeys(store){ return new Promise(function(res,rej){ var t=db.transaction(store,"readonly"), q=t.objectStore(store).getAllKeys(); q.onsuccess=function(){res(q.result||[]);}; q.onerror=function(){rej(q.error);}; }); }
function idbClear(store){ return new Promise(function(res){ var t=db.transaction(store,"readwrite"); t.objectStore(store).clear(); t.oncomplete=function(){res();}; }); }

  labs:{},custom:[],tagEdits:{},checklist:{},lastBackup:0,lastLab:""}; }
function migrate(d){
  if(!d || typeof d!=="object") return fresh();
  var f=fresh();
  Object.keys(f).forEach(function(k){ if(d[k]===undefined) d[k]=f[k]; });
  Object.keys(f.settings).forEach(function(k){ if(d.settings[k]===undefined) d.settings[k]=f.settings[k]; });
  Object.keys(d.labs||{}).forEach(function(k){ var r=d.labs[k]; if(r && r.graph && !r.graphs){ r.graphs=[{id:"g_"+uid(),title:"",x:+r.graph.x||0,ys:[r.graph.y==null?1:+r.graph.y],type:r.graph.type||"line",show:!!r.graph.show}]; delete r.graph; } });

var saveTimer=null;
function save(now){
  $("#saveChip").textContent="Saving…";

function shrink(file){

    img.onerror=function(){ URL.revokeObjectURL(u); rej(new Error("That file isn't a picture this browser can open. Try a JPEG or PNG.")); };
    img.src=u;

function allLabs(){

  return list;
}
function ordOf(l){ if(l.ord) return l.ord; var x=parseFloat(l.id.split(".")[1]); return isNaN(x)?50:x; }

/* ===================== Writing coach ===================== */
var SLANG=["cool","awesome","super","kinda","sorta","gonna","wanna","stuff","lol","totally","pretty much","a lot","crazy","weird","basically","like,"];
var IMPER=["add","pour","put","place","mix","stir","measure","fill","wait","take","record","drop","heat","cut","weigh","observe","use","set","fold","tape","connect","stretch","roll","shake","let","get","make","label"];
function coach(key,text){
  var t=(text||"").trim(), out=[];
  if(!t) return out;
  var pron=t.match(/\b(I|I'm|I've|we|we're|my|our|us|me|you|your)\b/g);
  if(pron && key!=="hypothesis"){ out.push("Lab reports don't use "+Array.from(new Set(pron)).slice(0,3).map(function(w){return '"'+w+'"';}).join(", ")+". Try: \"The water was measured…\" instead of \"I measured…\""); }
  var low=" "+t.toLowerCase()+" ", slang=SLANG.filter(function(w){ return low.indexOf(" "+w+" ")>=0 || low.indexOf(" "+w+".")>=0 || low.indexOf(" "+w+",")>=0 || (w.slice(-1)==="," && low.indexOf(" "+w)>=0); });
  if(slang.length) out.push("Swap casual words ("+slang.slice(0,3).map(function(w){return '"'+w.replace(/,$/,"")+'"';}).join(", ")+") for exact scientific words.");
  if(key==="procedure"){
    var sentences=t.split(/[.!?]\s+|\n+/), bad=sentences.filter(function(s){ var w=s.trim().split(/\s+/)[0]; return w && IMPER.indexOf(w.toLowerCase().replace(/[^a-z]/g,""))>=0; });
    if(bad.length) out.push("Write the procedure in past tense, as what was done. \""+bad[0].trim().slice(0,40)+"…\" could become \"…was added\" or \"…was measured.\"");
  }
  if(key==="conclusion"){
    if(!/error|mistake|inaccura|uncertain|could have|might have|may have|imprecise|estimate/i.test(t)) out.push("Add one possible source of error, and how it could have changed the results.");
    if(t.length<80) out.push("A conclusion is usually 3 or more sentences: what was learned, whether the hypothesis was supported, and a source of error.");
  }
  if(key==="hypothesis" && !/\bif\b|\bwill\b|predict|expect/i.test(t)) out.push("A hypothesis makes a prediction. Try an if… then… sentence.");
  if((key==="materials"||key==="data") && /\b(\d+(\.\d+)?)\s*(oz|ounces?|inch(es)?|in\.|cups?|tsp|tbsp|°F|fahrenheit|pounds?|lbs?|feet|foot|ft)\b/i.test(t)) out.push("Use metric units: mL, L, g, cm, °C.");
  return out;
}

var synth=window.speechSynthesis||null, speakingEl=null, speakQueue=[], speakOn=false;
function voices(){ if(!synth) return []; return synth.getVoices().filter(function(v){ return /^en/i.test(v.lang); }); }
function pickVoice(){
  var vs=voices(); if(!vs.length) return null;
  if(data && data.settings.voice){ var m=vs.filter(function(v){return v.name===data.settings.voice;}); if(m.length) return m[0]; }
  var order=[/en-CA/i,/en-US/i,/en-GB/i,/^en/i];
  for(var i=0;i<order.length;i++){ for(var j=0;j<vs.length;j++){ if(order[i].test(vs[j].lang)) return vs[j]; } }
  return vs[0];
}

function speakItems(items){
  if(!synth){ toast("Read-aloud isn't available in this browser."); return; }

  items.forEach(function(it){ var parts=(it.text||"").replace(/\s+/g," ").match(/[^.!?]+[.!?]*\s*/g)||[]; parts.forEach(function(p){ if(p.trim()) speakQueue.push({text:p.trim(),el:it.el}); }); });
  var v=pickVoice();

    var it=speakQueue.shift(), u=new SpeechSynthesisUtterance(it.text);

}

function graphSVG(t,g){
  var xi=+g.x, cx=t.cols[xi]; if(!cx) return '<p class="small muted">Pick a column for across the bottom.</p>';
  var ser=g.ys.filter(function(ci){ return t.cols[ci] && ci!==xi; });
  if(!ser.length) return '<p class="small muted">Tick at least one column under "Up the side."</p>';
  var rows=t.rows.map(function(r){ return {xr:String(r[xi]||"").trim(),x:num(r[xi]),y:ser.map(function(ci){ return num(r[ci]); })}; })

  for(var v=ymin; v<=ymax+1e-9; v+=step){ var yy=Y(v); s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="currentColor" stroke-opacity=".12"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end" font-size="12" fill="currentColor">'+fmtN(v)+'</text>'; }
  var numericX=rows.every(function(p){ return !isNaN(p.x); });
  if(g.type==="line" && numericX){
    var xs=rows.map(function(p){return p.x;}), xmin=Math.min.apply(null,xs), xmax=Math.max.apply(null,xs); if(xmax===xmin) xmax=xmin+1;
    var xstep=nice((xmax-xmin)/5); xmin=Math.floor(xmin/xstep)*xstep; xmax=Math.ceil(xmax/xstep)*xstep;

      var col=SERIES_COL[k%SERIES_COL.length], pts=rows.filter(function(p){ return !isNaN(p.y[k]); }).slice().sort(function(a,b){ return a.x-b.x; });

  var ro=!!window.__pfReviewedOnly, labs=finishedList(ro);
  var h='<div class="row noprint" style="margin-bottom:12px"><a class="btn ghost" href="#teacher">← Home teacher</a><button class="btn" data-action="print">🖨️ Print or save as PDF</button><label class="small"><input type="checkbox" data-action="pfToggle"'+(ro?" checked":"")+'> Reviewed reports only</label></div>';
  h+='<div class="report"><h1>Science Portfolio: Physical Science Labs</h1><p class="meta">'+esc(data.student)+' · Apologia <i>Exploring Creation with Physical Science</i>, 4th Edition · Prepared '+esc(fmtDate(todayISO()))+'</p>';
  h+='<h2>Saskatchewan Science 9 outcomes: evidence</h2><table><thead><tr><th>Outcome</th><th>What it covers</th><th>Evidence</th></tr></thead><tbody>';
  Object.keys(OUTCOMES).forEach(function(k){ var ev=labs.filter(function(l){return l.tags.indexOf(k)>=0;}); h+='<tr><td><b>'+k+'</b></td><td>'+esc(OUTCOMES[k])+'</td><td>'+(ev.length?ev.map(function(l){return "Exp. "+esc(l.id);}).join(", "):"<i>Not yet</i>")+'</td></tr>'; });
  h+='</tbody></table>';
  h+='<h2>Periodic log</h2>';
  var byM={}; labs.forEach(function(l){ var r=data.labs[l.id], dt=r.status==="elsewhere"?(r.elsewhere&&r.elsewhere.date):(r.finished||r.date); var k=monthKey(dt||""); (byM[k]=byM[k]||[]).push({l:l,dt:dt,r:r}); });
  var keys=Object.keys(byM).sort();
  if(!keys.length) h+='<p>No labs finished yet.</p>';
  keys.forEach(function(k){ h+='<p><b>'+(k?esc(monthName(k)):"Undated")+'</b></p><ul>'+byM[k].sort(function(a,b){return (a.dt||"")<(b.dt||"")?-1:1;}).map(function(x){ return '<li>'+esc(fmtDate(x.dt))+': Experiment '+esc(x.l.id)+', '+esc(x.l.title)+(x.r.status==="elsewhere"?" (done in Student Notebook)":"")+(x.r.reviewed?" ✓ reviewed":"")+'</li>'; }).join("")+'</ul>'; });
  h+='</div>';
  labs.filter(function(l){return statusOf(l.id)==="finished";}).forEach(function(l){ h+='<div class="pf-break" style="margin-top:20px">'+reportHTML(l.id)+'</div>'; });
  app.innerHTML=h; fillPhotos(app);
}

/* ===================== Modals ===================== */
function modal(html){ var root=$("#modalRoot"); root.innerHTML='<div class="modal" role="dialog" aria-modal="true"><div class="box">'+html+'</div></div>'; var f=root.querySelector("input,select,textarea,button"); if(f) f.focus(); }
function closeModal(){ $("#modalRoot").innerHTML=""; }
document.addEventListener("keydown",function(e){ if(e.key==="Escape"){ if($("#modalRoot").innerHTML) closeModal(); else stopSpeak(); } });

/* ===================== Events ===================== */
document.addEventListener("click",function(e){
  var sayB=e.target.closest("[data-say]");
  if(sayB){ var el=sayB.getAttribute("data-say-el"); sayText(sayB.getAttribute("data-say"), el?$(el):sayB.closest(".sect,.card")); return; }
  var b=e.target.closest("[data-action]"); if(!b) return;
  var a=b.getAttribute("data-action"), id=b.getAttribute("data-id");
  if(b.tagName==="INPUT" && (b.type==="file"||b.type==="checkbox")) return; // handled on change
  if(a==="setupGo"){ var n=($("#sName").value||"").trim(); if(!n){ toast("Type your first name first."); return; } data.student=n.split(/\s+/)[0].slice(0,30); save(true); location.hash="#home"; route(); return; }
  if(a==="stopSpeak"){ stopSpeak(); return; }
  if(a==="voicePanel"){ voicePanel(); return; }
  if(a==="closeModal"){ closeModal(); return; }
  if(a==="print"){ window.print(); return; }
  if(a==="saySupplies"){ var mm=MODULES[+b.getAttribute("data-mod")-1], words=[]; mm.bags.forEach(function(bg){ words.push("From the kit, "+bg.name+": "+bg.items.join(", ")+"."); }); if(mm.provide.length) words.push("From home: "+mm.provide.join(", ")+"."); if(mm.note) words.push(mm.note); sayText(words.join(" ")||"No supplies needed.",$("#supplies")); return; }
  if(a==="clearChecks"){ data.checklist[b.getAttribute("data-mod")]={}; save(); route(); return; }
  if(a==="elsewhere"){ elsewhereModal(id); return; }
  if(a==="elsewhereSave"){ var r=rec(id), dt=$("#ewDate").value||todayISO(); r.status="elsewhere"; r.elsewhere={date:dt,note:($("#ewNote").value||"").trim()}; r.date=dt; save(true); closeModal(); toast("Saved as done in the notebook."); route(); return; }
  if(a==="undoElsewhere"){ var r2=rec(id); r2.status=Object.keys(r2.sections).length?"progress":"not"; r2.elsewhere=null; save(); route(); return; }
  if(a==="finish"){ var rr=rec(id), miss=sectionsFor().filter(function(k){ return k!=="data" && !(rr.sections[k]||"").trim(); });
    if(miss.length){ modal('<h2>Almost there</h2><p>These parts are still empty: <b>'+miss.map(function(k){return esc(SECTIONS[k].label);}).join(", ")+'</b>.</p><p>Finish them first, or mark it finished anyway?</p><div class="row"><button class="btn" data-action="closeModal">Keep working</button><button class="btn ghost" data-action="finishAnyway" data-id="'+esc(id)+'">Finished anyway</button></div>'); return; }
    doFinish(id); return; }
  if(a==="finishAnyway"){ closeModal(); doFinish(id); return; }
  if(a==="addRow"||a==="addCol"||a==="delRow"||a==="delCol"){ tableOp(a); return; }
  if(a==="addGraph"){ var lg=currentLabId(), gl=graphsOf(rec(lg)); if(gl.length>=MAX_GRAPHS) return; gl.push(newGraph(ensureTable(rec(lg)))); touch(lg); refreshGraph(); var cards=$all(".gcard"); if(cards.length){ cards[cards.length-1].scrollIntoView({block:"nearest"}); var ti=cards[cards.length-1].querySelector('[data-g=title]'); if(ti) ti.focus(); } return; }
  if(a==="delGraph"){ var ld=currentLabId(), gd=graphsOf(rec(ld)), gi=+b.getAttribute("data-gi"); if(!gd[gi]) return; if(!confirm("Remove Graph "+(gi+1)+"? The data table stays the same.")) return; gd.splice(gi,1); touch(ld); refreshGraph(); return; }
  if(a==="calcInsert"){ var lid=currentLabId(), c=rec(lid).calc||{}, out=calcOut(c); if(/^Density =/.test(out)){ var ta=$("#ta_data"); ta.value=(ta.value?ta.value.replace(/\s+$/,"")+"\n":"")+out.replace(/ \(.*\)$/,"")+"."; onSection(ta); toast("Added to your data."); } else toast(out); return; }
  if(a==="delPhoto"){ var lr=rec(currentLabId()), i=+b.getAttribute("data-i"), p=lr.photos[i]; if(!p) return; lr.photos.splice(i,1); idbDel("photos",p.id); save(); refreshData(); return; }
  if(a==="readReport"){ var paras=$all("#app .report h1, #app .report h2, #app .report p, #app .report figcaption").map(function(el){ return {text:el.textContent,el:el}; }); speakItems(paras); return; }
  if(a==="pinGo"){ if(($("#pinIn").value||"")===data.settings.pin){ teacherUnlocked=true; route(); } else toast("That PIN doesn't match."); return; }
  if(a==="markReviewed"){ var x=rec(id), ta2=$('[data-comment="'+cssEsc(id)+'"]'); if(ta2) x.comment=ta2.value.trim(); x.reviewed=true; save(true); toast("Marked reviewed."); route(); return; }
  if(a==="backup"){ doBackup(); return; }
  if(a==="addLab"){ addLab(); return; }
  if(a==="delLab"){ if(hasRec(id) && Object.keys(data.labs[id].sections).length){ if(!confirm("This experiment has written work. Remove it and its report?")) return; } data.custom=data.custom.filter(function(c){return c.id!==id;}); delete data.labs[id]; save(true); route(); return; }
  if(a==="saveSettings"){ var nm=($("#setName").value||"").trim(); if(nm) data.student=nm.split(/\s+/)[0].slice(0,30); data.settings.length=$("#setLen").value; data.settings.pin=($("#setPin").value||"").trim(); teacherUnlocked=true; save(true); toast("Settings saved."); return; }
  if(a==="eraseAll"){ modal('<h2>Erase everything?</h2><p>All reports and photos on this computer will be deleted. This can\'t be undone without a backup file.</p><label for="eraseConfirm">Type <b>ERASE</b> to confirm</label><input type="text" id="eraseConfirm" style="width:100%;margin:6px 0 12px"><div class="row"><button class="btn danger" data-action="eraseGo">Erase</button><button class="btn ghost" data-action="closeModal">Cancel</button></div>'); return; }
  if(a==="eraseGo"){ if(($("#eraseConfirm").value||"").trim()!=="ERASE"){ toast("Type ERASE to confirm."); return; } idbClear("photos").then(function(){ data=fresh(); return idbPut("kv","data",data); }).then(function(){ closeModal(); teacherUnlocked=false; location.hash="#home"; route(); toast("Everything was erased."); }); return; }
  if(a==="restoreGo"){ doRestore(); return; }
});
function cssEsc(s){ return String(s).replace(/["\\]/g,"\\$&"); }
function currentLabId(){ var h=location.hash.slice(1).split("/"); return h[0]==="lab"?decodeURIComponent(h.slice(1).join("/")):""; }
function doFinish(id){ var r=rec(id); r.status="finished"; r.finished=todayISO(); r.reviewed=false; save(true); location.hash="#report/"+encodeURIComponent(id); toast("Nice work! Your report is finished. 🎉"); }

document.addEventListener("input",function(e){
  var t=e.target;
  if(t.matches("textarea[data-sec]")) return onSection(t);
  var lid=currentLabId();
  if(t.matches("[data-tcol]")){ var tb=ensureTable(rec(lid)); tb.cols[+t.getAttribute("data-tcol")].name=t.value; touch(lid); refreshGraph(); return; }
  if(t.matches("[data-tr]")){ var tb2=ensureTable(rec(lid)); tb2.rows[+t.getAttribute("data-tr")][+t.getAttribute("data-tc")]=t.value; touch(lid); refreshGraph(); refreshAvg(); return; }
  if(t.matches("[data-calc]")){ var r=rec(lid); r.calc=r.calc||{}; r.calc[t.getAttribute("data-calc")]=t.value; $("#calcOut").textContent=calcOut(r.calc); save(); return; }
  if(t.matches("[data-g=title]")){ var gc2=t.closest("[data-gi]"), g2=graphsOf(rec(lid))[+gc2.getAttribute("data-gi")]; g2.title=t.value; touch(lid); return; }
  if(t.matches("[data-cap]")){ rec(lid).photos[+t.getAttribute("data-cap")].caption=t.value; save(); return; }
  if(t.matches("[data-comment]")){ rec(t.getAttribute("data-comment")).comment=t.value; save(); return; }
  if(t.matches("[data-field=date]")){ rec(lid).date=t.value; save(); return; }
});
document.addEventListener("change",function(e){
  var t=e.target, lid=currentLabId();
  if(t.matches("[data-tunit]")){ ensureTable(rec(lid)).cols[+t.getAttribute("data-tunit")].unit=t.value; touch(lid); refreshGraph(); refreshAvg(); return; }
  if(t.matches("[data-g]")){ var gc=t.closest("[data-gi]"), gr=graphsOf(rec(lid))[+gc.getAttribute("data-gi")], gk=t.getAttribute("data-g");
    if(gk==="x"){ gr.x=+t.value; fixGraph(gr,ensureTable(rec(lid))); touch(lid); refreshGraph(); return; }
    if(gk==="y"){ var ci=+t.value; if(t.checked){ if(gr.ys.indexOf(ci)<0) gr.ys.push(ci); } else { if(gr.ys.length<=1){ t.checked=true; toast("A graph needs at least one column up the side."); return; } gr.ys=gr.ys.filter(function(c){ return c!==ci; }); } touch(lid); refreshGraph(); return; }
    if(gk==="title") return;
    if(gk==="type"){ gr.type=t.value; } if(gk==="show"){ gr.show=t.checked; } touch(lid); refreshOneGraph(gc,gr); return; }
  if(t.matches("[data-check]")){ var m=t.getAttribute("data-check"); data.checklist[m]=data.checklist[m]||{}; data.checklist[m][t.getAttribute("data-key")]=t.checked; save(); return; }
  if(t.matches("[data-tag]")){ var id=t.getAttribute("data-id"), d=labDef(id), tags=d.tags.slice(), k2=t.getAttribute("data-tag"); if(t.checked){ if(tags.indexOf(k2)<0) tags.push(k2); } else tags=tags.filter(function(x){return x!==k2;}); data.tagEdits[id]=tags; save(); return; }
  if(t.matches("[data-action=addPhoto]")){ var f=t.files&&t.files[0]; if(!f) return; toast("Adding photo…"); var target=lid||t.getAttribute("data-id");
    addPhotoFromFile(f).then(function(pid){ rec(target).photos.push({id:pid,caption:""}); touch(target); save(true); if(lid) refreshData(); else { var ph=$("#ewPhotos"); if(ph) ph.textContent=rec(target).photos.length+" photo(s) attached."; } toast("Photo added."); })
      .catch(function(err){ toast(err.message||"Couldn't add that photo."); }); t.value=""; return; }
  if(t.matches("[data-action=restore]")){ var f2=t.files&&t.files[0]; if(f2) restoreModal(f2); t.value=""; return; }
  if(t.matches("[data-action=pfToggle]")){ window.__pfReviewedOnly=t.checked; renderPortfolio(); return; }
  if(t.matches("#vVoice")){ data.settings.voice=t.value; save(); return; }
  if(t.matches("#vRate")){ data.settings.rate=+t.value; save(); return; }
  if(t.matches("#vHl")){ data.settings.highlight=t.checked; save(); return; }
});
document.addEventListener("keydown",function(e){ if(e.key==="Enter" && e.target.id==="sName"){ e.preventDefault(); $("[data-action=setupGo]").click(); } if(e.key==="Enter" && e.target.id==="pinIn"){ e.preventDefault(); $("[data-action=pinGo]").click(); } });

function touch(id){ var r=rec(id); if(r.status==="not") r.status="progress"; save(); }
var hintTimer=null;
function onSection(t){
  var id=t.getAttribute("data-id"), k=t.getAttribute("data-sec"), r=rec(id);
  r.sections[k]=t.value; touch(id);
  clearTimeout(hintTimer);
  hintTimer=setTimeout(function(){ var ul=$("#hints_"+k); if(ul) ul.innerHTML=coach(k,t.value).map(function(h){return "<li>"+esc(h)+"</li>";}).join(""); },700);
}
function refreshGraph(){ var lid=currentLabId(), p=$("#graphsPanel"); if(!p) return; var ae=document.activeElement, inPanel=ae&&p.contains(ae), sel=inPanel?{gi:ae.closest("[data-gi]")&&ae.closest("[data-gi]").getAttribute("data-gi"),g:ae.getAttribute("data-g"),v:ae.value}:null;
  p.outerHTML=graphPanel(lid);
  if(sel){ var q='[data-gi="'+sel.gi+'"] [data-g="'+sel.g+'"]'+(sel.g==="y"?'[value="'+sel.v+'"]':''), el=$(q); if(el) el.focus(); } }
function refreshOneGraph(card,g){ var box=card.querySelector(".graphBox"); if(box) box.innerHTML=graphSVG(ensureTable(rec(currentLabId())),g); }
function refreshAvg(){ var lid=currentLabId(), t=ensureTable(rec(lid)), cells=$all("table.dt tfoot td"); cells.forEach(function(td,ci){ var a=avg(t,ci); td.textContent=a!==null?"Average: "+a:""; }); }
function refreshData(){ var lid=currentLabId(), box=$("#dataTools"); if(box){ var y=window.scrollY; box.outerHTML=dataTools(lid); fillPhotos(app); window.scrollTo(0,y); } }
function tableOp(a){
  var lid=currentLabId(), t=ensureTable(rec(lid));
  if(a==="addRow") t.rows.push(t.cols.map(function(c,ci){ return ci===0?String(t.rows.length+1):""; }));
  if(a==="addCol"){ if(t.cols.length>=8){ toast("8 columns is the limit."); return; } t.cols.push({name:"",unit:""}); t.rows.forEach(function(r){ r.push(""); }); }
  if(a==="delRow"){ if(t.rows.length<=1) return; var last=t.rows[t.rows.length-1]; if(last.some(function(c,ci){return ci>0&&String(c).trim();}) && !confirm("The last row has data in it. Remove it?")) return; t.rows.pop(); }
  if(a==="delCol"){ if(t.cols.length<=2) return; var ci=t.cols.length-1; if(t.rows.some(function(r){return String(r[ci]||"").trim();}) && !confirm("The last column has data in it. Remove it?")) return; t.cols.pop(); t.rows.forEach(function(r){ r.pop(); }); graphsOf(rec(lid)).forEach(function(g){ fixGraph(g,t); }); }
  touch(lid); refreshData();
}
function elsewhereModal(id){
  var d=labDef(id);
  modal('<h2>Done in the Student Notebook</h2><p>Experiment '+esc(id)+': '+esc(d.title)+'</p><p class="small muted">Use this for a lab that was written up in the Student Notebook instead of here. It still counts in the portfolio log.</p>'+
    '<label>Date it was done <input type="date" id="ewDate" value="'+todayISO()+'"></label>'+
    '<p style="margin-top:10px"><label for="ewNote">Note (optional)</label><textarea id="ewNote" style="min-height:70px" placeholder="e.g. Pages 12–13 of the Student Notebook"></textarea></p>'+
    '<label class="btn ghost small">📷 Add a photo of the notebook page<input type="file" accept="image/*" data-action="addPhoto" data-id="'+esc(id)+'" hidden></label> <span class="small muted" id="ewPhotos"></span>'+
    '<div class="row" style="margin-top:14px"><button class="btn" data-action="elsewhereSave" data-id="'+esc(id)+'">Save</button><button class="btn ghost" data-action="closeModal">Cancel</button></div>');
}
function voicePanel(){
  var vs=voices(), cur=pickVoice();
  modal('<h2>🔊 Reading voice</h2>'+(synth?'':'<p>Read-aloud isn\'t available in this browser.</p>')+
    '<p><label>Voice <select id="vVoice" style="width:100%">'+vs.map(function(v){ return '<option value="'+esc(v.name)+'"'+(cur&&cur.name===v.name?" selected":"")+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>'; }).join("")+'</select></label></p>'+
    '<p><label>Speed <select id="vRate"><option value="0.8"'+(data.settings.rate==0.8?" selected":"")+'>Slow</option><option value="1"'+(data.settings.rate==1?" selected":"")+'>Normal</option><option value="1.2"'+(data.settings.rate==1.2?" selected":"")+'>Fast</option></select></label></p>'+
    '<p><label><input type="checkbox" id="vHl"'+(data.settings.highlight?" checked":"")+'> Highlight what\'s being read</label></p>'+
    '<div class="row"><button class="btn secondary" data-say="This is how your lab reports will sound when they are read aloud.">Try it</button><button class="btn" data-action="closeModal">Done</button></div>');
}
function addLab(){
  var m=+$("#addM").value, n=($("#addNum").value||"").trim(), t=($("#addTitle").value||"").trim();
  if(!/^\d{1,2}\.[A-Za-z0-9]{1,3}$/.test(n)){ toast("Number should look like 4.1"); return; }
  if(+n.split(".")[0]!==m){ toast("The number should start with the module number ("+m+")."); return; }
  if(!t){ toast("Type the title."); return; }
  if(labDef(n)){ toast("Experiment "+n+" is already in the list."); return; }
  var tags=$all("[data-addtag]").filter(function(c){return c.checked;}).map(function(c){return c.getAttribute("data-addtag");});
  data.custom.push({id:n,m:m,title:t,optional:$("#addOpt").checked,tags:tags}); save(true); toast("Added Experiment "+n+"."); route();
}

/* ===================== Backup / restore ===================== */
function blobToDataURL(b){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; r.readAsDataURL(b); }); }
function dataURLToBlob(u){ var p=u.split(","), mime=(p[0].match(/:(.*?);/)||[])[1]||"image/jpeg", bin=atob(p[1]), arr=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }
function doBackup(){
  toast("Making backup…");
  flush().then(function(){ return idbAllKeys("photos"); }).then(function(keys){
    return Promise.all(keys.map(function(k){ return idbGet("photos",k).then(function(r){ return r&&r.blob?blobToDataURL(r.blob).then(function(u){ return [k,u]; }):null; }); }));
  }).then(function(pairs){
    var photos={}; pairs.forEach(function(p){ if(p) photos[p[0]]=p[1]; });
    data.lastBackup=Date.now();
    var out={app:"fun-lab-reports",appVersion:APP_VERSION,saved:new Date().toISOString(),data:data,photos:photos};
    var blob=new Blob([JSON.stringify(out)],{type:"application/json"}), a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="fun-lab-reports-backup-"+(data.student||"student").replace(/\W/g,"")+"-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500);
    save(true); toast("Backup downloaded. Check your Downloads folder."); if(location.hash==="#teacher") route();
  }).catch(function(e){ toast("Backup failed: "+(e&&e.message||e)); });
}
var pendingRestore=null;
function restoreModal(file){
  var fr=new FileReader();
  fr.onload=function(){
    var obj; try{ obj=JSON.parse(fr.result); }catch(e){ toast("That isn't a Fun Lab Reports backup file."); return; }
    if(!obj || obj.app!=="fun-lab-reports" || !obj.data || typeof obj.data.labs!=="object"){ toast("That isn't a Fun Lab Reports backup file."); return; }
    pendingRestore=obj;
    var n=Object.keys(obj.data.labs).length, ph=Object.keys(obj.photos||{}).length;
    modal('<h2>Restore this backup?</h2><p>Backup from <b>'+esc(new Date(obj.saved).toLocaleString("en-CA"))+'</b> for <b>'+esc(obj.data.student||"(no name)")+'</b>: '+n+' lab'+(n===1?"":"s")+', '+ph+' photo'+(ph===1?"":"s")+'.</p><p><b>This replaces everything currently on this computer.</b></p><div class="row"><button class="btn danger" data-action="restoreGo">Replace with backup</button><button class="btn ghost" data-action="closeModal">Cancel</button></div>');
  };
  fr.readAsText(file);
}
function doRestore(){
  var obj=pendingRestore; if(!obj) return;
  var d=migrate(obj.data), photos=obj.photos||{};
  idbClear("photos").then(function(){
    return Object.keys(photos).reduce(function(p,k){ return p.then(function(){ return idbPut("photos",k,{blob:dataURLToBlob(photos[k]),t:Date.now()}); }); },Promise.resolve());
  }).then(function(){ data=d; urlCache={}; return idbPut("kv","data",data); }).then(function(){ pendingRestore=null; closeModal(); toast("Backup restored."); location.hash="#home"; route(); })
    .catch(function(e){ toast("Restore failed: "+(e&&e.message||e)); });
}

/* ===================== Start ===================== */
openDB().then(function(d){ db=d; return idbGet("kv","data"); }).then(function(d){
  data=migrate(d||fresh());
  if(!d) idbPut("kv","data",data);
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persisted().then(function(p){ if(!p) navigator.storage.persist(); }).catch(function(){}); }
  route();
}).catch(function(e){
  app.innerHTML='<div class="card safety"><h2>This browser can\'t save work here</h2><p>'+esc(e&&e.message||e)+'</p><p>Try opening Fun Lab Reports in Safari or Chrome (not a private window).</p></div>';
});
})();
</script>
